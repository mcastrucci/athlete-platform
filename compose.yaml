services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: athlete
      POSTGRES_PASSWORD: athlete
      POSTGRES_DB: athlete
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athlete -d athlete"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
