[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "athlete-platform"
version = "0.1.0"
description = "Training development platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
athlete-worker = "athlete_platform.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athlete_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]

